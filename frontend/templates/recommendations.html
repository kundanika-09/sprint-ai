{% extends "base.html" %}{% block title %}AI Insights{% endblock %}{% block heading %}AI Insights{% endblock %}
{% block content %}
<div class="row g-3">
 <div class="col-xl-6"><div class="panel h-100"><h6><i class="bi bi-123"></i> Story Point Estimation</h6>
  <input id="spTitle" class="form-control mb-2" placeholder="Story title" value="Implement Student Login Module with JWT Authentication">
  <textarea id="spDesc" class="form-control mb-2" rows="2" placeholder="Story description"></textarea>
  <div class="row g-2 mb-2"><div class="col"><select id="spPrio" class="form-select"><option>Highest</option><option selected>High</option><option>Medium</option><option>Low</option></select></div>
  <div class="col"><select id="spType" class="form-select"><option>Task</option><option>Improvement</option><option>Bug</option><option>Documentation</option></select></div>
  <div class="col-auto"><button class="btn btn-primary" id="spBtn">Estimate</button></div></div>
  <div id="spOut" class="result-slot"></div></div></div>
 <div class="col-xl-6"><div class="panel h-100"><h6><i class="bi bi-graph-up-arrow"></i> Sprint Success Prediction <button class="btn btn-link btn-sm p-0 ms-2" id="ssLoad">use active sprint</button></h6>
  <div class="row g-2 mb-2">
   <div class="col-4"><label class="small text-muted">Stories</label><input id="ss1" type="number" class="form-control" value="12"></div>
   <div class="col-4"><label class="small text-muted">Story Points</label><input id="ss2" type="number" class="form-control" value="40"></div>
   <div class="col-4"><label class="small text-muted">Velocity</label><input id="ss3" type="number" class="form-control" value="35"></div>
   <div class="col-4"><label class="small text-muted">Blocked</label><input id="ss4" type="number" class="form-control" value="2"></div>
   <div class="col-4"><label class="small text-muted">Pending</label><input id="ss5" type="number" class="form-control" value="9"></div>
   <div class="col-4 d-flex align-items-end"><button class="btn btn-primary w-100" id="ssBtn">Predict</button></div></div>
  <div id="ssOut" class="result-slot"></div></div></div>
 <div class="col-xl-6"><div class="panel h-100"><h6><i class="bi bi-shield-exclamation"></i> Risk Analysis</h6>
  <div class="row g-2 mb-2">
   <div class="col-4"><label class="small text-muted">Story Points</label><input id="rk1" type="number" class="form-control" value="8"></div>
   <div class="col-4"><label class="small text-muted">Priority</label><select id="rk2" class="form-select"><option>Highest</option><option>High</option><option selected>Medium</option><option>Low</option></select></div>
   <div class="col-4"><label class="small text-muted">Blocked Issues</label><input id="rk3" type="number" class="form-control" value="3"></div>
   <div class="col-4"><label class="small text-muted">Dependencies</label><input id="rk4" type="number" class="form-control" value="4"></div>
   <div class="col-4"><label class="small text-muted">Sprint Workload</label><input id="rk5" type="number" class="form-control" value="45"></div>
   <div class="col-4 d-flex align-items-end"><button class="btn btn-primary w-100" id="rkBtn">Analyze</button></div></div>
  <div id="rkOut" class="result-slot"></div></div></div>
 <div class="col-xl-6"><div class="panel h-100"><h6><i class="bi bi-list-check"></i> Backlog Recommendations
   <span class="float-end small fw-normal">Capacity (pts) <input id="capIn" type="number" class="form-control form-control-sm d-inline-block" style="width:80px"></span></h6>
  <div id="recOut" class="result-slot"></div></div></div>
 <div class="col-12"><div class="panel"><h6><i class="bi bi-activity"></i> Model Performance (MLOps)</h6><div class="table-responsive"><table class="table table-sm mb-2" id="mlTable"></table></div>
  <div class="small text-muted" id="mlNote"></div></div></div>
</div>{% endblock %}
