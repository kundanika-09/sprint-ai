{% extends "base.html" %}{% block title %}Dashboard{% endblock %}{% block heading %}Sprint Dashboard{% endblock %}

<div class="row g-3">
  <div class="col-lg-4"><div class="panel"><h6>Risk Distribution</h6><div class="chart-box"><canvas id="riskChart"></canvas></div></div></div>

    <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Key</th><th>Title</th><th>Priority</th><th>Pts</th><th>Blockers</th><th>Stage</th></tr></thead><tbody id="riskTable"></tbody></table></div></div></div>
