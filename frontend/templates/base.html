<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}SprintIQ{% endblock %} | AI Sprint Planning Assistant</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body data-page="{{ page }}">
<aside class="sidebar" id="sidebar">
  <div class="brand"><i class="bi bi-kanban-fill"></i><div><b>SprintIQ</b><small>Agile Analytics &amp; MLOps</small></div></div>
  <nav>
    <a href="/" class="{{ 'active' if page=='dashboard' }}"><i class="bi bi-speedometer2"></i>Dashboard</a>
    <a href="/board" class="{{ 'active' if page=='board' }}"><i class="bi bi-layout-three-columns"></i>Sprint Board</a>
    <a href="/analytics" class="{{ 'active' if page=='analytics' }}"><i class="bi bi-bar-chart-line"></i>Analytics</a>
    <a href="/insights" class="{{ 'active' if page=='insights' }}"><i class="bi bi-cpu"></i>AI Insights</a>
  </nav>
  <div class="side-foot">Dataset: Apache Mesos<br>176 issues &middot; 61 sprints</div>
</aside>
<div class="main">
  <header class="topbar">
    <button class="btn btn-sm btn-outline-secondary d-lg-none" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="bi bi-list"></i></button>
    <h1 class="page-title">{% block heading %}{% endblock %}</h1>
    <div class="ms-auto d-flex align-items-center gap-2">
      <label class="small text-muted mb-0">Sprint</label>
      <select id="sprintSelect" class="form-select form-select-sm" style="width:130px"></select>
    </div>
  </header>
  <main class="content">{% block content %}{% endblock %}</main>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="toast" class="toast text-bg-dark"><div class="toast-body" id="toastMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body></html>
